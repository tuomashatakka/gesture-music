<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Gesture Detection</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: #1a1a2e;
        color: white;
        overflow: hidden;
      }
      #container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
      }
      #video-container {
        position: relative;
        flex: 1;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #status {
        padding: 10px;
        text-align: center;
        background: rgba(0,0,0,0.5);
        color: #00ff88;
        font-size: 14px;
      }
      #info {
        padding: 10px;
        text-align: center;
        background: rgba(0,0,0,0.7);
        color: #aaa;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
      </div>
      <div id="status">Waiting for libraries to load...</div>
      <div id="info">Hand Gesture Detection with MediaPipe Hands</div>
    </div>
    <!-- Load MediaPipe Hands from CDN - must load before module -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
